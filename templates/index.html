{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow-lg border-0">
      <div class="card-body text-center p-5">
        <h2 class="fw-bold text-primary mb-3">🌐 Bienvenido a Mini Weka Digital</h2>
        <p class="text-muted mb-4">
          Una plataforma web desarrollada con <strong>Flask</strong> para 
          entrenar, validar y clasificar modelos de Machine Learning de manera sencilla.
        </p>

        <div class="d-flex justify-content-center gap-3">
          <a href="{{ url_for('train') }}" class="btn btn-lg btn-primary shadow-sm">
            ⚙️ Entrenar un modelo
          </a>
          <a href="{{ url_for('classify') }}" class="btn btn-lg btn-success shadow-sm">
            🔍 Clasificar con modelo
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
